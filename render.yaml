services:
  - type: web
    name: nashmi-ride
    env: node
    plan: free
    region: frankfurt
    rootDir: ./
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ADMIN_KEY
        value: darbak-2026
      - key: DATABASE_URL
        fromDatabase:
          name: nashmi-ride-db
          property: connectionString
databases:
  - name: nashmi-ride-db
    plan: free
    region: frankfurt
