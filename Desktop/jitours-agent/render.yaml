services:
  - type: web
    name: jordan-inspiration-tours
    runtime: node
    rootDir: Desktop/jitours-agent
    plan: free
    buildCommand: npm ci && npm run db:generate:postgres && npx next build
    startCommand: npm run db:migrate:postgres && npm run seed:if-empty:postgres && npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jordan-inspiration-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CUSTOMER_NAME
        sync: false
      - key: CUSTOMER_EMAIL
        sync: false
      - key: CUSTOMER_PASSWORD
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5

databases:
  - name: jordan-inspiration-db
    databaseName: jordan_inspiration
    user: jitours
    plan: free
