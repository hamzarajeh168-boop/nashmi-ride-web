<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nashmi Ride | الكابتن</title>
  <style>
    :root{--green:#19a974;--ink:#14231f;--muted:#71817b;--line:#e5eeea;--bg:#f5f8f6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Tahoma,Arial}
    .app{min-height:100vh;display:grid;grid-template-columns:minmax(420px,520px) 1fr;direction:ltr}
    .panel{direction:rtl;background:#fff;padding:28px;box-shadow:8px 0 35px #12332216;overflow:auto}
    .map{position:relative;background:#dbe8df;overflow:hidden}.map:before{content:"";position:absolute;inset:-15%;background:repeating-linear-gradient(20deg,transparent 0 54px,#c3d8c9 55px 58px),repeating-linear-gradient(110deg,transparent 0 75px,#c8dbce 76px 79px);transform:rotate(-8deg)}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:22px;font-weight:800}.brand b{color:var(--green)}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e4f4ec;color:var(--green);font-weight:800}
    h1{font-size:30px;margin:0 0 8px}.sub,p{color:var(--muted);line-height:1.8}.step{display:none}.step.active{display:block}
    input{width:100%;border:1px solid var(--line);outline:0;padding:12px;border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .field,.upload{border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin:10px 0}.field small{display:block;color:var(--muted)}.upload{display:block;border-style:dashed;color:var(--muted);font-size:13px}.upload input{border:0;padding:7px 0}
    button{font:inherit;font-weight:800;cursor:pointer}.primary,.secondary{width:100%;padding:14px;border-radius:13px;margin-top:10px}.primary{border:0;background:var(--green);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.filter{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.filter.active{border:2px solid var(--green);background:#effaf4}
    .ride{border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:10px;background:#f8fbf9}.ride-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ride-actions button{border:0;border-radius:11px;padding:12px;background:var(--green);color:#fff}.ride-actions .reject{background:#fff5f6;border:1px solid #f1c5cd;color:#b13245}.ride-actions .finish{grid-column:1/-1;background:#1c6ee8}
    .msg{min-height:22px;color:var(--green)}.error{color:#d5485b}.map-label{position:absolute;z-index:1;top:25px;left:30px;background:#fff;padding:13px 17px;border-radius:14px;font-weight:800}
    @media(max-width:850px){.app{display:block}.map{height:240px}.panel{padding:22px}}
  </style>
  <style>
    :root{--green:#d9a928;--ink:#f7f4ec;--muted:#b7b5ae;--line:rgba(255,255,255,.12);--bg:#111214}
    body{background:#111214;color:var(--ink)}.app{background:#111214}.panel{background:#111214;color:var(--ink)}
    .map{background:#202227}.map:before{background:linear-gradient(32deg,transparent 44%,rgba(217,169,40,.25) 45%,rgba(217,169,40,.25) 47%,transparent 48%),repeating-linear-gradient(15deg,transparent 0 46px,#30343d 47px 49px),repeating-linear-gradient(105deg,transparent 0 70px,#2b3038 71px 73px)}
    .brand b,.msg{color:#e7b735}.avatar{background:#2b2923;color:#e7b735}.ride,.field,.upload,.filter{background:#202227;color:var(--ink);border-color:var(--line)}
    .filter.active{border-color:#e7b735;background:#302a1c}.sub,p,.field small,.upload{color:var(--muted)}input{background:#202227;color:var(--ink);border-color:var(--line)}
    .primary,.ride-actions button{background:#e7b735;color:#171717}.secondary{background:#202227;color:var(--ink);border-color:var(--line)}
    .map-label{background:#202227;color:#e7b735}.ride{box-shadow:0 8px 22px #0004}.ride-actions .reject{background:#351f23;color:#ff9da8;border-color:#7c3944}.ride-actions .finish{background:#2c7be5;color:#fff}
    @media(max-width:850px){.app{display:flex;flex-direction:column}.map{order:0;height:43vh;min-height:43vh}.panel{order:1;margin-top:-24px;border-radius:26px 26px 0 0;position:relative;z-index:2;padding:24px 20px 38px}.map-label{top:20px;left:20px}}
  </style>
</head>
<body>
<div class="app"><aside class="panel">
  <header class="top"><div class="brand">🚗 <b>Nashmi</b> Ride</div><div class="avatar">ك</div></header>
  <section id="auth" class="step active"><h1>حساب الكابتن</h1><div class="grid"><input id="phone" placeholder="رقم الهاتف"><input id="password" type="password" placeholder="كلمة المرور"></div><button class="primary" id="login">تسجيل الدخول</button><button class="secondary" id="startRegister">إنشاء حساب كابتن</button><p id="authMsg" class="msg"></p></section>
  <section id="registerOne" class="step"><h1>بياناتك الأساسية</h1><div class="field"><small>الاسم الكامل</small><input id="name"></div><div class="field"><small>رقم الهاتف</small><input id="regPhone"></div><div class="field"><small>كلمة المرور</small><input id="regPassword" type="password" minlength="6"></div><label class="upload">الصورة الشخصية<input id="photo" type="file" accept="image/*" capture="user"></label><button class="primary" id="next">التالي</button><button class="secondary" id="back">رجوع</button><p id="regMsg" class="msg"></p></section>
  <section id="registerTwo" class="step"><h1>بيانات السيارة</h1><div class="field"><small>نوع السيارة</small><input id="carType"></div><div class="grid"><input id="carNumber" placeholder="رقم السيارة"><input id="plateNumber" placeholder="نمرة السيارة"></div><label class="upload">صورة السيارة<input id="car" type="file" accept="image/*" capture="environment"></label><label class="upload">صورة الهوية<input id="identity" type="file" accept="image/*" capture="environment"></label><label class="upload">رخصة القيادة<input id="drivingLicense" type="file" accept="image/*" capture="environment"></label><label class="upload">رخصة السيارة<input id="license" type="file" accept="image/*" capture="environment"></label><label class="upload">عدم المحكومية<input id="clearance" type="file" accept="image/*" capture="environment"></label><button class="primary" id="register">إرسال طلب التسجيل</button><button class="secondary" id="backOne">رجوع</button><p id="registerMsg" class="msg"></p></section>
  <section id="dashboard" class="step"><h1>طلبات مسبقة</h1><div id="profile" class="ride"></div><button class="primary" id="toggleAvailability">متاح الآن</button><div class="filters"><button class="filter active" data-mode="all">كل الرحلات</button><button class="filter" data-mode="intra">داخل المحافظة</button><button class="filter" data-mode="intercity">خارج المحافظة</button><button class="filter" data-car="shared">مشتركة</button><button class="filter" data-car="private">خاصة</button></div><button class="secondary" id="refresh">تحديث القائمة</button><button class="secondary" id="historyBtn">سجل رحلاتي</button><button class="secondary" id="logout">تسجيل الخروج</button><p id="msg" class="msg"></p><div id="rides"></div><div id="history"></div></section>
</aside><section class="map"><div class="map-label">Nashmi Ride · Captain</div></section></div>
<script>
const state={token:localStorage.getItem('nashmi_captain_token')||'',mode:'all',car:'all'},$=id=>document.getElementById(id);
const show=id=>document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',x.id===id));
const headers=()=>({Authorization:`Bearer ${state.token}`});
const msg=(text,error=false)=>{$('msg').textContent=text;$('msg').className=`msg${error?' error':''}`};
function availability(on){const b=$('toggleAvailability');b.textContent=on?'متاح الآن ✅':'غير متاح الآن ⏳';b.dataset.available=String(on);b.style.background=on?'#19a974':'#e1e7e4';b.style.color=on?'#fff':'#14231f'}
function profile(user){availability(user.available!==false);const v=user.vehicle||{};$('profile').innerHTML=`<b>${user.name}</b><p>رقم الحساب: ${user.phone}<br>السيارة: ${v.carType||'—'} · ${v.plateNumber||'—'}<br>الحالة: ${user.available===false?'غير متاح':'متاح'}</p>`}
async function file(id){const f=$(id).files[0];if(!f)return '';return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
$('startRegister').onclick=()=>show('registerOne');$('back').onclick=()=>show('auth');$('backOne').onclick=()=>show('registerOne');
$('next').onclick=()=>{if(!$('name').value||!$('regPhone').value||$('regPassword').value.length<6||!$('photo').files[0]){$('regMsg').textContent='أكمل البيانات والصورة الشخصية';$('regMsg').className='msg error';return}show('registerTwo')};
$('register').onclick=async()=>{const documents={photo:await file('photo'),car:await file('car'),identity:await file('identity'),drivingLicense:await file('drivingLicense'),license:await file('license'),clearance:await file('clearance')};const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'captain',name:$('name').value.trim(),phone:$('regPhone').value.trim(),password:$('regPassword').value,vehicle:{carType:$('carType').value,carNumber:$('carNumber').value,plateNumber:$('plateNumber').value,capacity:4},documents})});const d=await r.json();$('registerMsg').textContent=r.ok?'تم إرسال الطلب للموافقة':(d.error||'تعذر إرسال الطلب');$('registerMsg').className=`msg${r.ok?'':' error'}`;if(r.ok)setTimeout(()=>show('auth'),700)};
$('login').onclick=async()=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'captain',phone:$('phone').value.trim(),password:$('password').value})});const d=await r.json();$('authMsg').textContent=r.ok?`مرحبًا ${d.user.name}`:(d.error||'بيانات الدخول غير صحيحة');$('authMsg').className=`msg${r.ok?'':' error'}`;if(r.ok){state.token=d.token;localStorage.setItem('nashmi_captain_token',state.token);profile(d.user);show('dashboard');load()}};
$('toggleAvailability').onclick=async()=>{const current=$('toggleAvailability').dataset.available==='true';const r=await fetch('/api/captains/me/availability',{method:'PATCH',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({available:!current})});const d=await r.json();if(!r.ok)return msg(d.error||'تعذر تحديث الحالة',true);availability(d.available);profile(d.user);msg(d.available?'أنت متاح الآن':'أنت غير متاح الآن')};
async function history(){const r=await fetch('/api/rides/history',{headers:headers()});const d=await r.json();$('history').innerHTML='<h3>سجل الرحلات</h3>'+(r.ok&&d.length?d.map(x=>`<article class="ride"><b>${x.tripNumber}</b><p>${x.from||'—'} ← ${x.to||'—'}<br>الحالة: ${x.status}<br>قيمة الطلب: ${Number(x.price||0).toFixed(2)} د.أ · صافي الكابتن: ${Number(x.captainNet||0).toFixed(2)} د.أ</p></article>`).join(''):'<p>لا توجد رحلات سابقة.</p>')}
async function act(trip,action){const endpoint=action==='accept'?`/api/rides/${encodeURIComponent(trip)}/assign`:action==='reject'?`/api/rides/${encodeURIComponent(trip)}/reject`:action==='arrive'?`/api/rides/${encodeURIComponent(trip)}/arrive`:`/api/rides/${encodeURIComponent(trip)}/complete`;const r=await fetch(endpoint,{method:'POST',headers:headers()});const d=await r.json();msg(r.ok?(action==='accept'?'تم قبول الرحلة ✅':action==='reject'?'تم رفض الرحلة':action==='arrive'?'تم إشعار العميل أنك وصلت 📍':'تم إنهاء الرحلة عند الوصول ✅'):(d.error||'تعذر تنفيذ العملية'),!r.ok);load()}
async function chat(trip){const text=prompt('اكتب رسالتك للعميل');if(!text)return;const r=await fetch(`/api/rides/${encodeURIComponent(trip)}/chat`,{method:'POST',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({text})});msg(r.ok?'تم إرسال الرسالة 💬':'تعذر إرسال الرسالة',!r.ok);load()}
async function load(){if(!state.token)return;const r=await fetch('/api/rides/available',{headers:headers()});const available=await r.json();const list=r.ok?available.filter(x=>(state.mode==='all'||x.rideType===state.mode)&&(state.car==='all'||x.vehicleType===state.car)):[];const mine=await fetch('/api/rides/mine',{headers:headers()});const active=mine.ok?await mine.json():[];const cards=[...list,...active.filter(x=>!list.some(y=>y.tripNumber===x.tripNumber))];$('rides').innerHTML=cards.length?cards.map(x=>{const started=x.status==='started',assigned=x.status==='assigned',customerPhone=x.customer?.phone||x.customerPhone||'';const nav=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(x.from||'الأردن')}`;return `<article class="ride"><b>رقم الرحلة: ${x.tripNumber}</b><p>العميل: ${x.customer?.name||x.customerName||'—'}<br>السعر: <strong>${Number(x.price||0).toFixed(2)} د.أ</strong><br>${x.from||'—'} ← ${x.to||'—'}<br>الحالة: ${x.status}${x.arrivedAt?' · تم إشعار العميل بالوصول':''}</p><div class="ride-actions">${x.status==='searching'?`<button data-a="accept" data-t="${x.tripNumber}">قبول الرحلة</button><button class="reject" data-a="reject" data-t="${x.tripNumber}">رفض الرحلة</button>`:''}${assigned?`<button class="primary" data-a="start" data-t="${x.tripNumber}">بدء الرحلة</button>`:''}${started?`<button data-a="arrive" data-t="${x.tripNumber}">وصلت للعميل</button><button class="finish" data-a="complete" data-t="${x.tripNumber}">إنهاء الرحلة عند الوصول</button>`:''}${customerPhone?`<a class="secondary" href="tel:${customerPhone}">اتصال بالعميل</a>`:''}<a class="secondary" href="${nav}" target="_blank">الاتجاه إلى العميل</a><button class="secondary" data-a="chat" data-t="${x.tripNumber}">دردشة</button></div></article>`}).join(''):'<p>لا توجد رحلات حالياً.</p>';document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{if(b.dataset.a==='start'){const r=await fetch(`/api/rides/${encodeURIComponent(b.dataset.t)}/start`,{method:'POST',headers:headers()});msg(r.ok?'بدأت الرحلة ✅':'تعذر بدء الرحلة',!r.ok);load()}else if(b.dataset.a==='chat'){chat(b.dataset.t)}else act(b.dataset.t,b.dataset.a)})}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));load()});document.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{state.car=b.dataset.car;document.querySelectorAll('[data-car]').forEach(x=>x.classList.toggle('active',x===b));load()});$('refresh').onclick=load;$('historyBtn').onclick=history;$('logout').onclick=()=>{localStorage.removeItem('nashmi_captain_token');location.reload()};if(state.token){show('dashboard');load()}
setInterval(()=>{if(state.token)load()},8000);
</script></body></html>
