<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nashmi Ride | العميل</title>
<style>
:root{--gold:#e7b735;--bg:#0b0f19;--panel:#111827;--card:#202227;--muted:#9ca3af;--line:#ffffff18}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:"Segoe UI",Tahoma,Arial}
.app{min-height:100vh;display:grid;grid-template-columns:minmax(420px,480px) 1fr;direction:ltr}
.panel{direction:rtl;background:rgba(17,24,39,.96);padding:32px;box-shadow:10px 0 40px #0008;overflow:auto}.map{position:relative;overflow:hidden;background:#171b24;min-height:100vh}
.map:before{content:"";position:absolute;inset:-15%;background:linear-gradient(30deg,transparent 44%,#2d333e 45%,#2d333e 47%,transparent 48%),repeating-linear-gradient(18deg,transparent 0 60px,#252b35 61px 64px),repeating-linear-gradient(108deg,transparent 0 90px,#292f39 91px 94px);transform:rotate(-8deg)}
.map:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,transparent 0 18%,#0002 58%,#0009 100%)}
.brand{font-size:25px;font-weight:900;letter-spacing:-.7px;display:inline-flex;align-items:center;gap:9px}.brand:before{content:"";width:9px;height:27px;border-radius:8px;background:linear-gradient(180deg,#f5c84b,#c98514);box-shadow:7px 0 0 #f5c84b}.brand b{color:#fff}.brand em{font-style:normal;color:var(--gold)}.top{display:flex;justify-content:flex-start;align-items:center;margin-bottom:40px}
.step{display:none}.step.active{display:block}h1{font-size:29px;margin:0 0 8px}.sub,p{color:var(--muted);line-height:1.8}.input-group{margin:18px 0}.input-group label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
input{width:100%;padding:14px 15px;background:#1f2937;border:1px solid var(--line);border-radius:12px;color:#fff;font-size:15px;outline:0}input:focus{border-color:var(--gold);box-shadow:0 0 0 4px #e7b73520}
button{width:100%;padding:14px;border-radius:12px;border:0;font:inherit;font-weight:800;cursor:pointer;margin-top:10px}.primary{background:linear-gradient(135deg,#f5b942,#d97706);color:#111}.secondary{background:transparent;border:1px solid var(--line);color:#d1d5db}.msg{min-height:24px;color:var(--gold)}.error{color:#ff7585}.auth-card{max-width:390px}.field{background:#1f2937;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0}.field small{display:block;color:var(--muted);margin-bottom:4px}.upload{display:block;border:1px dashed #ffffff30;border-radius:12px;padding:13px;color:var(--muted);margin:12px 0}.upload input{border:0;padding:7px 0;background:transparent}
.map-brand{position:absolute;z-index:2;top:28px;left:30px;background:#202227;color:var(--gold);padding:13px 17px;border-radius:14px;font-weight:800}.map-pin{position:absolute;z-index:2;top:43%;left:50%;font-size:42px}
.ride-screen{position:fixed;inset:0;z-index:5;background:#111214;display:none}.ride-screen.active{display:block}.ride-map{position:absolute;inset:0;background:#202227;overflow:hidden}.ride-map:before{content:"";position:absolute;inset:-20%;background:linear-gradient(25deg,transparent 43%,#343944 44%,#343944 47%,transparent 48%),repeating-linear-gradient(18deg,transparent 0 76px,#30343d 77px 80px),repeating-linear-gradient(108deg,transparent 0 110px,#2b3038 111px 114px);transform:rotate(-7deg)}.ride-map:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,transparent 0 20%,#0002 58%,#0009 100%)}.ride-pin{position:absolute;z-index:1;top:42%;left:50%;font-size:42px}.customer-map-tools{position:absolute;z-index:4;top:24px;left:20px;right:20px;display:flex;justify-content:space-between;direction:ltr}.map-tool{width:52px;height:52px;margin:0;padding:0;border-radius:50%;background:#292b39;color:#fff;font-size:24px;box-shadow:0 8px 22px #0008}.customer-drawer{position:absolute;z-index:10;inset:0 auto 0 0;width:min(390px,88vw);padding:34px 27px;background:#111214;transform:translateX(-105%);transition:.25s;box-shadow:14px 0 40px #0008}.customer-drawer.open{transform:translateX(0)}.drawer-title{display:flex;align-items:center;gap:14px;margin-bottom:42px}.drawer-title button{width:48px;margin:0;background:#292b39;color:#fff;font-size:25px}.drawer-title strong{font-size:24px}.drawer-profile{background:linear-gradient(125deg,#24262b,#86691d);border-radius:24px;padding:22px;margin-bottom:22px}.drawer-profile strong{font-size:22px}.drawer-profile small{display:block;color:#ddd;margin-top:6px}.drawer-item{display:flex;align-items:center;gap:16px;width:100%;margin:0;padding:17px 3px;background:transparent;color:#f7f4ec;text-align:right;font-size:17px}.drawer-item span{width:30px;font-size:23px}.drawer-item small{margin-right:auto;color:#999}.sheet{position:absolute;z-index:3;left:0;right:0;bottom:0;max-height:68vh;overflow:auto;background:#111214;border-radius:25px 25px 0 0;padding:20px 22px 26px;box-shadow:0 -12px 35px #0009}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet-head h1{font-size:24px}.status{color:var(--gold);background:#302a1c;border-radius:20px;padding:7px 10px;font-size:12px}.route-card{background:#292b34;border-radius:17px;padding:5px 14px;margin:12px 0}.route-card .ride-field{margin:0;background:transparent;border:0;border-bottom:1px solid #ffffff18;border-radius:0}.route-card .ride-field:last-child{border:0}.service-grid{display:flex;gap:9px;overflow:auto;padding:3px 0 8px}.choice{min-width:155px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;color:#fff;text-align:right}.choice.active{border:2px solid var(--gold);background:#302a1c}.choice small{display:block;color:var(--muted);margin-top:5px}.ride-field{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 14px;margin:10px 0}.ride-field small{color:var(--muted);display:block}.ride-field input{border:0;background:transparent;padding:7px 0}.voice-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ride-actions{display:grid;grid-template-columns:1fr;gap:8px}.ride-actions button:last-child{grid-column:auto}.ride-actions .primary{background:#f5b900;color:#111;font-size:18px}.payment-row{display:flex;justify-content:space-between;color:#ddd;padding:8px 2px;font-size:15px}.ride-list article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}.rating{display:flex;gap:5px}.rating button{margin:0;padding:8px;background:#302a1c;color:var(--gold)}.chat{position:fixed;inset:0;z-index:20;background:#111214;padding:24px;display:flex;flex-direction:column}.chat-list{flex:1;overflow:auto;background:var(--card);border-radius:16px;padding:14px}.chat-row{padding:10px 0;border-bottom:1px solid var(--line)}.chat-row small{display:block;color:var(--muted);margin-top:4px}.chat-compose{display:flex;gap:8px;margin-top:12px}.chat-compose button{width:95px;margin:0}.chat-compose input{flex:1}
@media(max-width:850px){.app{display:block}.map{min-height:38vh}.panel{padding:24px 20px}.ride-screen .sheet{max-height:70vh}}
</style>
</head>
<body>
<div class="app"><aside class="panel"><header class="top"><div class="brand"><b>Nashmi</b><em>Ride</em></div></header>
<section id="authStep" class="step active"><div class="auth-card"><h1>أهلاً بك مجددًا 👋</h1><p class="sub">سجّل الدخول وابدأ رحلتك بأمان داخل الأردن.</p><div class="input-group"><label>رقم الهاتف أو المعرف</label><input id="phone" placeholder="079XXXXXXX" autocomplete="tel"></div><div class="input-group"><label>كلمة المرور</label><input id="password" type="password" placeholder="••••••••"></div><button class="primary" id="login">تسجيل الدخول</button><button class="secondary" id="showRegister">إنشاء حساب جديد</button><p id="authMsg" class="msg"></p></div></section>
<section id="registerStep" class="step"><h1>إنشاء حساب عميل</h1><p class="sub">أنشئ حسابك خلال دقيقة.</p><div class="field"><small>الاسم</small><input id="regName" placeholder="اسم العميل"></div><div class="field"><small>رقم الهاتف</small><input id="regPhone" placeholder="07xxxxxxxx"></div><div class="field"><small>كلمة المرور</small><input id="regPassword" type="password" minlength="6" placeholder="6 أحرف أو أرقام على الأقل"></div><label class="upload">الصورة الشخصية (اختيارية)<input id="regPhoto" type="file" accept="image/*" capture="user"></label><button class="primary" id="register">إنشاء الحساب</button><button class="secondary" id="backAuth">رجوع</button><p id="regMsg" class="msg"></p></section>
</aside><section class="map"><div class="map-brand">Nashmi Ride · الأردن</div><div class="map-pin">📍</div></section></div>
<section id="rideScreen" class="ride-screen"><div class="ride-map"><div class="customer-map-tools"><button class="map-tool" id="customerMenu" aria-label="القائمة">☰</button><button class="map-tool" id="customerWallet" aria-label="المحفظة">▣</button></div><div class="ride-pin">◉</div></div><div class="customer-drawer" id="customerDrawer"><div class="drawer-title"><button id="closeCustomerMenu">×</button><strong>القائمة</strong></div><div class="drawer-profile"><strong id="customerName">العميل</strong><small>Nashmi Ride · الأردن</small></div><button class="drawer-item"><span>♙</span>الملف الشخصي</button><button class="drawer-item"><span>♧</span>الإشعارات <small>0</small></button><button class="drawer-item" id="drawerWallet"><span>▣</span>المحفظة <small id="drawerBalance">0 JOD</small></button><button class="drawer-item" id="drawerHistory"><span>▤</span>رحلاتي السابقة</button><button class="drawer-item"><span>⚙</span>الإعدادات</button><button class="drawer-item" id="drawerLogout"><span>↪</span>تسجيل الخروج</button></div><div class="sheet"><div class="sheet-head"><h1>إلى أين نذهب؟</h1><span class="status">جاهز للطلب</span></div><p id="wallet" class="sub">جاري تحميل المحفظة...</p><div class="route-card"><div class="ride-field"><small>من</small><input id="from" placeholder="موقع الانطلاق"></div><div class="ride-field"><small>إلى</small><input id="to" placeholder="اختر الوجهة"></div></div><div class="service-grid"><button class="choice active" data-service="private">سيارة خاصة<small>من 1.20 د.أ</small></button><button class="choice" data-service="electric">سيارة كهرباء<small>من 1.20 د.أ</small></button><button class="choice" data-service="shared_intra">مشترك داخلي<small>اقتصادي</small></button><button class="choice" data-service="shared_intercity">مشترك خارجي<small>بين المحافظات</small></button><button class="choice" data-service="airport">توصيل المطار<small>مطار الملكة علياء</small></button></div><div class="payment-row"><span>◷ الآن</span><span>▣ الدفع نقدًا</span></div><div class="voice-row"><button class="secondary" id="voiceRequest">🎙️ احجز بالصوت</button><button class="secondary" id="locate">📍 موقعي الحالي</button></div><div class="ride-actions"><button class="primary" id="submit">تحديد نقطة الانطلاق والبحث</button></div><button class="secondary" id="historyBtn">سجل رحلاتي</button><button class="secondary" id="logout">تسجيل الخروج</button><p id="msg" class="msg"></p><div id="mine" class="ride-list"></div><div id="history" class="ride-list"></div></div></section>
<script>
const s={token:localStorage.getItem('nashmi_customer_token')||'',serviceType:'private',location:null,rideSnapshot:new Map(),chatSnapshot:new Map()},$=id=>document.getElementById(id),auth=()=>({Authorization:`Bearer ${s.token}`}),show=id=>document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',x.id===id));
function sound(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=760;g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.36)}catch{}}
function announce(text){sound();if('speechSynthesis'in window)window.speechSynthesis.speak(new SpeechSynthesisUtterance(text))}
async function image(id){const file=$(id).files[0];if(!file)return '';return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
$('login').onclick=async()=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'customer',phone:$('phone').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok){$('authMsg').textContent=d.error||'بيانات الدخول غير صحيحة';$('authMsg').className='msg error';return}s.token=d.token;localStorage.setItem('nashmi_customer_token',s.token);$('customerName').textContent=d.user?.name||'العميل';$('authMsg').textContent='';$('rideScreen').classList.add('active');loadMine();loadWallet()};
$('showRegister').onclick=()=>show('registerStep');$('backAuth').onclick=()=>show('authStep');$('register').onclick=async()=>{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'customer',name:$('regName').value.trim(),phone:$('regPhone').value.trim(),password:$('regPassword').value,documents:{photo:await image('regPhoto')}})});const d=await r.json();$('regMsg').textContent=r.ok?'تم إنشاء الحساب، سجل الدخول الآن':(d.error||'تعذر إنشاء الحساب');$('regMsg').className=`msg ${r.ok?'':'error'}`;if(r.ok)show('authStep')};
document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{s.serviceType=b.dataset.service;document.querySelectorAll('[data-service]').forEach(x=>x.classList.toggle('active',x===b))});
$('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{s.location={lat:p.coords.latitude,lng:p.coords.longitude};$('from').value=`موقعي الحالي (${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)})`},()=>{$('msg').textContent='تعذر تحديد الموقع';$('msg').className='msg error'});
$('voiceRequest').onclick=()=>{const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){$('msg').textContent='الإدخال الصوتي غير مدعوم، استخدم متصفح Chrome';$('msg').className='msg error';return}const recognition=new Recognition();recognition.lang='ar-JO';recognition.interimResults=false;recognition.onstart=()=>{$('msg').textContent='احكِ: احجزلي رحلة لمجمع عمان';announce('تفضل، أين تريد الذهاب؟')};recognition.onerror=()=>{$('msg').textContent='لم أسمع الوجهة، حاول مرة ثانية';$('msg').className='msg error'};recognition.onresult=event=>{const text=event.results[0][0].transcript;const destinations=[['مجمع عمان','مجمع عمان'],['المجمع','مجمع عمان'],['المطار','المطار'],['وسط البلد','وسط البلد'],['الجامعة الأردنية','الجامعة الأردنية'],['الدوار السابع','الدوار السابع']];const found=destinations.find(([key])=>text.includes(key));$('to').value=found?found[1]:text.replace(/.*?(الى|إلى|لـ|ل)\\s*/,'').trim();navigator.geolocation?.getCurrentPosition(p=>{s.location={lat:p.coords.latitude,lng:p.coords.longitude};$('from').value=`موقعي الحالي (${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)})`;announce(`تم تحديد ${$('to').value}. اضغط البحث عن رحلة`);},()=>announce(`تم اختيار ${$('to').value}. حدد موقعك يدويًا`))};recognition.start()};
$('submit').onclick=async()=>{if(!$('from').value.trim()){$('msg').textContent='حدد موقع الانطلاق أولًا';$('msg').className='msg error';return}const r=await fetch('/api/rides',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({from:$('from').value.trim(),to:$('to').value.trim(),serviceType:s.serviceType,pickupLocation:s.location})});const d=await r.json();$('msg').textContent=r.ok?`تم إرسال الطلب ${d.tripNumber||''}`:(d.error||'تعذر إرسال الطلب');$('msg').className=`msg ${r.ok?'':'error'}`;if(r.ok)loadMine()};
async function rate(trip,rating){const r=await fetch(`/api/rides/${encodeURIComponent(trip)}/rating`,{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({rating})});if(r.ok){announce('تم حفظ تقييمك، شكرًا');loadMine()}}
async function loadMine(){const r=await fetch('/api/rides/mine',{headers:auth()});if(!r.ok)return;const rides=await r.json();await Promise.all(rides.map(async x=>{const previous=s.rideSnapshot.get(x.tripNumber);if(previous&&previous.status!==x.status)announce(x.status==='assigned'?'تم قبول رحلتك':x.status==='completed'?'انتهت الرحلة وظهر السعر':'تم تحديث حالة الرحلة');if(previous&&previous.arrivedAt!==x.arrivedAt&&x.arrivedAt)announce('وصل الكابتن إلى موقعك');s.rideSnapshot.set(x.tripNumber,{status:x.status,arrivedAt:x.arrivedAt});const chat=await fetch(`/api/rides/${encodeURIComponent(x.tripNumber)}/chat`,{headers:auth()});if(chat.ok){const messages=await chat.json(),count=s.chatSnapshot.get(x.tripNumber);if(count!==undefined&&messages.length>count)announce('وصلت رسالة جديدة');s.chatSnapshot.set(x.tripNumber,messages.length)}}));$('mine').innerHTML=rides.map(x=>`<article><b>رحلة ${x.tripNumber}</b><br>الحالة: ${x.status}${x.status==='completed'?`<br><strong>السعر: ${Number(x.price||0).toFixed(2)} د.أ</strong>`:''}<br>${x.captain?`الكابتن: ${x.captain.name} · ${x.captain.phone||''}`:'بانتظار كابتن'}<br><button class="secondary" onclick="openChat('${x.tripNumber}')">دردشة</button>${x.status==='completed'&&!x.customerRating?`<div class="rating"><span>قيّم الكابتن:</span>${[1,2,3,4,5].map(n=>`<button onclick="rate('${x.tripNumber}',${n})">${n}★</button>`).join('')}</div>`:''}</article>`).join('')};
async function openChat(trip){const r=await fetch(`/api/rides/${encodeURIComponent(trip)}/chat`,{headers:auth()});const messages=r.ok?await r.json():[];const box=document.createElement('div');box.className='chat';box.innerHTML=`<button class="secondary" id="closeChat">إغلاق</button><h2>دردشة الرحلة ${trip}</h2><div class="chat-list">${messages.length?messages.map(m=>`<div class="chat-row"><b>${m.senderName}</b><br>${m.text}<small>${new Date(m.createdAt).toLocaleTimeString('ar-JO')}</small></div>`).join(''):'لا توجد رسائل بعد'}</div><div class="chat-compose"><input id="chatText" placeholder="اكتب رسالة"><button class="primary" id="sendChat">إرسال</button></div>`;document.body.appendChild(box);box.querySelector('#closeChat').onclick=()=>box.remove();box.querySelector('#sendChat').onclick=async()=>{const input=box.querySelector('#chatText');if(!input.value.trim())return;const sent=await fetch(`/api/rides/${encodeURIComponent(trip)}/chat`,{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({text:input.value.trim()})});if(sent.ok){box.remove();openChat(trip)}}};
$('historyBtn').onclick=async()=>{const r=await fetch('/api/rides/history',{headers:auth()});if(!r.ok)return;const rides=await r.json();$('history').innerHTML='<h3>سجل الرحلات</h3>'+rides.map(x=>`<article>رحلة ${x.tripNumber}<br>${x.status}</article>`).join('')};
$('logout').onclick=()=>{localStorage.removeItem('nashmi_customer_token');location.reload()};$('customerMenu').onclick=()=>$('customerDrawer').classList.add('open');$('closeCustomerMenu').onclick=()=>$('customerDrawer').classList.remove('open');$('drawerLogout').onclick=()=>$('logout').click();$('drawerHistory').onclick=()=>{$('customerDrawer').classList.remove('open');$('historyBtn').click()};$('customerWallet').onclick=()=>{$('wallet').scrollIntoView({behavior:'smooth'});loadWallet()};$('drawerWallet').onclick=()=>{$('customerDrawer').classList.remove('open');$('wallet').scrollIntoView({behavior:'smooth'});loadWallet()};async function loadWallet(){const r=await fetch('/api/wallets/me',{headers:auth()});if(r.ok){const d=await r.json();$('wallet').textContent=`محفظتك: ${Number(d.balance||0).toFixed(2)} د.أ`;$('drawerBalance').textContent=`${Number(d.balance||0).toFixed(2)} JOD`}}if(s.token){$('rideScreen').classList.add('active');loadMine();loadWallet()}setInterval(()=>{if(s.token)loadMine()},8000);
</script>
</body></html>
