n-right:auto;color:#999}.drawer-item .notification-dot{width:9px;height:9px;border-radius:50%;background:#e54141;margin-right:auto}.drawer-spacer{flex:1}.become-driver{color:#f7f4ec}.become-driver .add-driver{margin-right:auto;background:#08a75a;color:#fff;border-radius:18px;padding:7px 13px;font-size:13px}.sheet{position:absolute;z-index:3;left:0;right:0;bottom:0;max-height:68vh;overflow:auto;background:#111214;border-radius:25px 25px 0 0;padding:20px 22px 26px;box-shadow:0 -12px 35px #0009}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet-head h1{font-size:24px}.status{color:var(--gold);background:#302a1c;border-radius:20px;padding:7px 10px;font-size:12px}.route-card{background:#292b34;border-radius:17px;padding:5px 14px;margin:12px 0}.route-card .ride-field{margin:0;background:transparent;border:0;border-bottom:1px solid #ffffff18;border-radius:0}.route-card .ride-field:last-child{border:0}.service-grid{display:flex;gap:9px;overflow:auto;padding:3px 0 8px}.choice{min-width:155px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;color:#fff;text-align:right}.choice.active{border:2px solid var(--gold);background:#302a1c}.choice small{display:block;color:var(--muted);margin-top:5px}.choice.disabled{opacity:.55;cursor:not-allowed}.ride-field{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 14px;margin:10px 0}.ride-field small{color:var(--muted);display:block}.ride-field input{border:0;background:transparent;padding:7px 0}.voice-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ride-actions{display:grid;grid-template-columns:1fr;gap:8px}.ride-actions button:last-child{grid-column:auto}.ride-actions .primary{background:#f5b900;color:#111;font-size:18px}.payment-row{display:flex;justify-content:space-between;color:#ddd;padding:8px 2px;font-size:15px}.ride-list article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}.rating{display:flex;gap:5px}.rating button{margin:0;padding:8px;background:#302a1c;color:var(--gold)}.chat{position:fixed;inset:0;z-index:20;background:#111214;padding:24px;display:flex;flex-direction:column}.chat-list{flex:1;overflow:auto;background:var(--card);border-radius:16px;padding:14px}.chat-row{padding:10px 0;border-bottom:1px solid var(--line)}.chat-row small{display:block;color:var(--muted);margin-top:4px}.chat-compose{display:flex;gap:8px;margin-top:12px}.chat-compose button{width:95px;margin:0}.chat-compose input{flex:1}

<div class="app"><aside class="panel"><header class="top"><div class="brand"><b>Nashmi</b><em>Ride</em></div></header>
<section id="authStep" class="step active"><div class="auth-card"><h1>أهلاً بك مجددًا 👋</h1><p class="sub">سجّل الدخول وابدأ رحلتك بأمان داخل الأردن.</p><div class="input-group"><label>رقم الهاتف أو المعرف</label><input id="phone" placeholder="079XXXXXXX" autocomplete="tel"></div><div class="input-group"><label>كلمة المرور</label><input id="password" type="password" placeholder="••••••••"></div><button class="primary" id="login">تسجيل الدخول</button><button class="secondary" id="showRegister">إنشاء حساب جديد</button><p id="authMsg" class="msg"></p></div></section>
<section id="registerStep" class="step"><h1>إنشاء حساب عميل</h1><p class="sub">أنشئ حسابك خلال دقيقة.</p><div class="field"><small>الاسم</small><input id="regName" placeholder="اسم العميل"></div><div class="field"><small>رقم الهاتف</small><input id="regPhone" placeholder="07xxxxxxxx"></div><div class="field"><small>كلمة المرور</small><input id="regPassword" type="password" minlength="6" placeholder="6 أحرف أو أرقام على الأقل"></div><label class="upload">الصورة الشخصية (اختيارية) - اخترها من الاستديو<input id="regPhoto" type="file" accept="image/*"></label><button class="primary" id="register">إنشاء الحساب</button><button class="secondary" id="backAuth">رجوع</button><p id="regMsg" class="msg"></p></section>
</aside><section class="map"><div class="map-brand">Nashmi Ride · الأردن</div><div class="map-pin">📍</div></section></div>
<section id="rideScreen" class="ride-screen"><div class="ride-map"><div class="customer-map-tools"><button class="map-tool" id="customerMenu" aria-label="القائمة">☰</button><button class="map-tool" id="customerWallet" aria-label="المحفظة">▣</button></div><div class="ride-pin">◉</div></div><div class="customer-drawer" id="customerDrawer"><div class="drawer-title"><button id="closeCustomerMenu">×</button><strong>القائمة</strong></div><div class="drawer-profile"><span class="drawer-rating"><b>★</b> 4.97</span><strong id="customerName">العميل</strong><small id="customerSummary">Nashmi Ride · الأردن</small></div><button class="drawer-item" id="customerProfile"><span>♙</span>الملف الشخصي</button><button class="drawer-item"><span>♧</span>الإشعارات <i class="notification-dot"></i></button><button class="drawer-item" id="drawerWallet"><span>▣</span>المحفظة <small id="drawerBalance">0 JOD</small></button><button class="drawer-item" id="drawerHistory"><span>▤</span>رحلاتي السابقة</button><button class="drawer-item"><span>◇</span>العروض والخصومات</button><button class="drawer-item" id="customerSettings"><span>⚙</span>الإعدادات</button><div class="drawer-spacer"></div><button class="drawer-item become-driver" id="becomeCaptain"><span>♧</span>كن كابتنًا <b class="add-driver">إضافة</b></button><button class="drawer-item" id="drawerLogout"><span>↪</span>تسجيل الخروج</button></div><div class="sheet"><div class="sheet-head"><h1>إلى أين نذهب؟</h1><span class="status">جاهز للطلب</span></div><p id="wallet" class="sub">جاري تحميل المحفظة...</p><div class="route-card"><div class="ride-field"><small>من</small><input id="from" placeholder="موقع الانطلاق"></div><div class="ride-field"><small>إلى (اختياري)</small><input id="to" placeholder="يمكن تركها فارغة"></div></div><div class="service-grid"><button class="choice active" data-service="private">سيارة خاصة<small>من 1.20 د.أ</small></button><button class="choice" data-service="electric">سيارة كهرباء<small>من 1.20 د.أ</small></button><button class="choice" data-service="jeep">طلب جيب<small>لجيب بسعة من 1 إلى 6 ركاب</small></button><button class="choice" data-service="shared_intra">مشترك داخلي<small>اقتصادي</small></button><button class="choice disabled" data-service="shared_intercity" disabled>مشترك خارج المحافظات<small>Coming soon</small></button><button class="choice" data-service="airport">توصيل المطار<small>مطار الملكة علياء</small></button></div><div class="payment-row"><span>◷ الآن</span><span>▣ الدفع نقدًا</span></div><div class="voice-row"><button class="secondary" id="voiceRequest">🎙️ احجز بالصوت</button><button class="secondary" id="locate">📍 موقعي الحالي</button></div><div class="ride-actions"><button class="primary" id="submit">تأكيد الرحلة</button></div><p id="msg" class="msg"></p><div id="mine" class="ride-list"></div><div id="history" class="ride-list"></div></div></section>
<script>
const s={token:localStorage.getItem('nashmi_customer_token')||'',serviceType:'private',location:null,destinationLocation:null,rideSnapshot:new Map(),chatSnapshot:new Map(),user:null},$=id=>document.getElementById(id),auth=()=>({Authorization:`Bearer ${s.token}`}),show=id=>document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',x.id===id));
function sound(){if(localStorage.getItem('nashmi_mute_sound')==='true')return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=760;g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.36)}catch{}}
function announce(text){if(localStorage.getItem('nashmi_mute_sound')==='true')return;sound();if('speechSynthesis'in window)window.speechSynthesis.speak(new SpeechSynthesisUtterance(text))}
async function image(id){const file=$(id).files[0];if(!file)return '';return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
$('login').onclick=async()=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'customer',phone:$('phone').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok){$('authMsg').textContent=d.error||'بيانات الدخول غير صحيحة';$('authMsg').className='msg error';return}s.token=d.token;s.user=d.user;localStorage.setItem('nashmi_customer_token',s.token);$('customerName').textContent=d.user?.name||'العميل';$('authMsg').textContent='';$('rideScreen').classList.add('active');loadMine();loadWallet()};
$('showRegister').onclick=()=>show('registerStep');$('backAuth').onclick=()=>show('authStep');$('register').onclick=async()=>{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'customer',name:$('regName').value.trim(),phone:$('regPhone').value.trim(),password:$('regPassword').value,documents:{photo:await image('regPhoto')}})});const d=await r.json();$('regMsg').textContent=r.ok?'تم إنشاء الحساب، سجل الدخول الآن':(d.error||'تعذر إنشاء الحساب');$('regMsg').className=`msg ${r.ok?'':'error'}`;if(r.ok)show('authStep')};
document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{s.serviceType=b.dataset.service;document.querySelectorAll('[data-service]').forEach(x=>x.classList.toggle('active',x===b))});
function setCurrentLocation(position){s.location={lat:position.coords.latitude,lng:position.coords.longitude};$('from').value=`موقعي الحالي (${position.coords.latitude.toFixed(5)}, ${position.coords.longitude.toFixed(5)})`;estimateFare()}
function requestCurrentLocation(){return new Promise((resolve,reject)=>{if(!navigator.geolocation){reject(new Error('المتصفح لا يدعم تحديد الموقع'));return}navigator.geolocation.getCurrentPosition(position=>{setCurrentLocation(position);resolve(position)},error=>reject(error),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})})}
$('locate').onclick=async()=>{try{await requestCurrentLocation();$('msg').textContent='تم تحديد موقع جهازك الحالي';$('msg').className='msg'}catch{$('msg').textContent='اسمح للمتصفح بالوصول إلى الموقع ثم حاول مرة أخرى';$('msg').className='msg error'}};
async function geocodeDestination(){const value=$('to').value.trim();if(!value)return null;const match=value.match(/(-?\d+(?:\.\d+)?)\s*[,،]\s*(-?\d+(?:\.\d+)?)/);if(match)return {lat:Number(match[1]),lng:Number(match[2])};try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),3500);const response=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jo&q=${encodeURIComponent(value)}`,{signal:controller.signal});clearTimeout(timeout);const results=await response.json();if(results[0])return {lat:Number(results[0].lat),lng:Number(results[0].lon)}}catch{}return null}
async function estimateFare(){if(!s.location||!$('to').value.trim())return null;const destinationLocation=await geocodeDestination();s.destinationLocation=destinationLocation;if(!destinationLocation)return null;const response=await fetch('/api/rides/estimate',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({serviceType:s.serviceType,pickupLocation:s.location,destinationLocation})});if(!response.ok)return null;const estimate=await response.json();$('msg').textContent=`المسافة التقريبية ${estimate.distanceKm} كم · الأجرة التقديرية ${Number(estimate.price).toFixed(2)} ${estimate.currency}`;$('msg').className='msg';return estimate}
async function submitRide(){const button=$('submit');if(button.disabled)return false;button.disabled=true;button.textContent='جاري تأكيد الرحلة...';try{if(!$('from').value.trim()&&!s.location){try{await requestCurrentLocation()}catch{$('msg').textContent='اسمح للمتصفح بالوصول إلى موقع جهازك أولًا';$('msg').className='msg error';return false}}if(!$('from').value.trim()){$('msg').textContent='حدد موقع الانطلاق أولًا';$('msg').className='msg error';return false}const destination=$('to').value.trim();const payload={from:$('from').value.trim(),to:destination || 'وجهة غير محددة',serviceType:s.serviceType,pickupLocation:s.location,destinationLocation:s.destinationLocation};const r=await fetch('/api/rides',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify(payload)});const d=await r.json();$('msg').textContent=r.ok?`تم إرسال الرحلة لأقرب كابتن متاح ${d.tripNumber||''}${d.price?` · الأجرة التقديرية ${Number(d.price).toFixed(2)} د.أ`:''}`:(d.error||'تعذر إرسال الرحلة');$('msg').className=`msg ${r.ok?'':'error'}`;if(r.ok){loadMine();if(destination&&!s.destinationLocation)estimateFare()}return r.ok}finally{button.disabled=false;button.textContent='تأكيد الرحلة'}}
function parseVoiceBooking(text){const cleaned=text.replace(/[،,.؟]/g,' ').replace(/\s+/g,' ').trim();const normalized=cleaned.replace(/^نشمي\s*/i,'').replace(/^(يا\s+)?نشمي\s*/i,'');const match=normalized.match(/(?:احجزلي|احجز|بدي|اريد|أريد)?\s*(?:رحلة|مشوار)?\s*(?:من|مِن)\s+(.+?)\s+(?:الى|إلى|لـ|ل)\s+(.+)$/i);if(match)return {from:match[1].trim(),to:match[2].trim()};const destination=normalized.match(/(?:الى|إلى|لـ|ل)\s+(.+)$/i);return {to:destination?destination[1].trim():normalized.replace(/^(?:احجزلي|احجز|بدي|اريد|أريد)\s*/i,'').replace(/^(?:رحلة|مشوار)\s*/i,'').trim()}}
function normalizeDestination(value){const destinations=[['مجمع عمان','مجمع عمان'],['المجمع','مجمع عمان'],['المطار','المطار'],['وسط البلد','وسط البلد'],['الجامعة الأردنية','الجامعة الأردنية'],['الدوار السابع','الدوار السابع']];return destinations.find(([key])=>value.includes(key))?.[1]||value}
$('voiceRequest').onclick=()=>{const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){$('msg').textContent='الإدخال الصوتي غير مدعوم، استخدم متصفح Chrome';$('msg').className='msg error';return}const recognition=new Recognition();recognition.lang='ar-JO';recognition.interimResults=false;recognition.onstart=()=>{$('msg').textContent='قل نقطة الانطلاق والوجهة إن رغبت';announce('تفضل، قل نقطة الانطلاق، والوجهة اختيارية')};recognition.onerror=()=>{$('msg').textContent='لم أفهم الطلب، حاول مرة أخرى';$('msg').className='msg error'};recognition.onresult=async event=>{const text=event.results[0][0].transcript;const booking=parseVoiceBooking(text);if(booking.from)$('from').value=booking.from;if(booking.to)$('to').value=normalizeDestination(booking.to);if(!$('from').value.trim()){navigator.geolocation?.getCurrentPosition(async p=>{s.location={lat:p.coords.latitude,lng:p.coords.longitude};$('from').value=`موقعي الحالي (${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)})`;announce(`تم تحديد ${$('to').value||'موقع الانطلاق'}`);await submitRide()},()=>announce('حدد موقع الانطلاق يدويًا'))}else{announce(`جاري حجز الرحلة${$('to').value.trim()?` إلى ${$('to').value}`:' بدون وجهة محددة'}`);await submitRide()}};recognition.start()};
$('submit').onclick=submitRide;
$('to').addEventListener('blur',estimateFare);
$('to').addEventListener('input',()=>{s.destinationLocation=null});
async function rate(trip,rating){const r=await fetch(`/api/rides/${encodeURIComponent(trip)}/rating`,{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({rating})});if(r.ok){announce('تم حفظ تقييمك، شكرًا');loadMine()}}
function invalidateCustomerSession(){if(!s.token)return;s.token='';s.user=null;localStorage.removeItem('nashmi_customer_token');$('rideScreen').classList.remove('active');show('authStep');$('authMsg').textContent='انتهت الجلسة، يرجى تسجيل الدخول من جديد';$('authMsg').className='msg error'}
async function loadMine(){const r=await fetch('/api/rides/mine',{headers:auth()});if(r.status===401){invalidateCustomerSession();return}if(!r.ok)return;const rides=await r.json();await Promise.all(rides.map(async x=>{const previous=s.rideSnapshot.get(x.tripNumber);if(previous&&previous.status!==x.status)announce(x.status==='assigned'?'تم قبول رحلتك':x.status==='completed'?'انتهت الرحلة وظهر السعر':'تم تحديث حالة الرحلة');if(previous&&previous.arrivedAt!==x.arrivedAt&&x.arrivedAt)announce('وصل الكابتن إلى موقعك');s.rideSnapshot.set(x.tripNumber,{status:x.status,arrivedAt:x.arrivedAt});const chat=await fetch(`/api/rides/${encodeURIComponent(x.tripNumber)}/chat`,{headers:auth()});if(chat.status===401){invalidateCustomerSession();return}if(chat.ok){const messages=await chat.json(),count=s.chatSnapshot.get(x.tripNumber);if(count!==undefined&&messages.length>count)announce('وصلت رسالة جديدة');s.chatSnapshot.set(x.tripNumber,messages.length)}}));if(!s.token)return;$('mine').innerHTML=rides.map(x=>{const details=x.status==='completed'?`<br><strong>قيمة الطلب: ${Number(x.price||0).toFixed(2)} د.أ</strong><small style="display:block;color:#aaa;margin-top:4px">${Number(x.distanceKm||0).toFixed(1)} كم · ${Math.round(Number(x.durationMinutes||0))} دقيقة رحلة${x.commission?` · عمولة الشركة ${Number(x.commission).toFixed(2)} د.أ`:''}</small>`:x.status==='completed'?'':'';const ackBtn=x.status==='completed'&&!x.customerAcknowledgedAt?`<br><button class="primary" onclick="ackRide('${x.tripNumber}')">موافق على القيمة ✅</button>`:x.status==='completed'?'<br><small style="color:#4caf50">تمت الموافقة على القيمة</small>':'';return `<article><b>رحلة ${x.tripNumber}</b><br>الحالة: ${x.status}${details}<br>${x.captain?`الكابتن: ${x.captain.name} · ${x.captain.phone||''}`:'بانتظار كابتن'}<br><button class="secondary" onclick="openChat('${x.tripNumber}')">دردشة</button>${ackBtn}${x.status==='completed'&&!x.customerRating?`<div class="rating"><span>قيّم الكابتن:</span>${[1,2,3,4,5].map(n=>`<button onclick="rate('${x.tripNumber}',${n})">${n}★</button>`).join('')}</div>`:''}</article>`}).join('')};
async function ackRide(trip){const r=await fetch(`/api/rides/${encodeURIComponent(trip)}/acknowledge`,{method:'POST',headers:auth()});if(r.ok)loadMine()};
async function openChat(trip){const r=await fetch(`/api/rides/${encodeURIComponent(trip)}/chat`,{headers:auth()});const messages=r.ok?await r.json():[];const box=document.createElement('div');box.className='chat';box.innerHTML=`<button class="secondary" id="closeChat">إغلاق</button><h2>دردشة الرحلة ${trip}</h2><div class="chat-list">${messages.length?messages.map(m=>`<div class="chat-row"><b>${m.senderName}</b><br>${m.text}<small>${new Date(m.createdAt).toLocaleTimeString('ar-JO')}</small></div>`).join(''):'لا توجد رسائل بعد'}</div><div class="chat-compose"><input id="chatText" placeholder="اكتب رسالة"><button class="primary" id="sendChat">إرسال</button></div>`;document.body.appendChild(box);box.querySelector('#closeChat').onclick=()=>box.remove();box.querySelector('#sendChat').onclick=async()=>{const input=box.querySelector('#chatText');if(!input.value.trim())return;const sent=await fetch(`/api/rides/${encodeURIComponent(trip)}/chat`,{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({text:input.value.trim()})});if(sent.ok){box.remove();openChat(trip)}}};
$('logout')?.addEventListener('click',()=>{localStorage.removeItem('nashmi_customer_token');location.reload()});function openSidebarPanel(title,content){const panel=document.createElement('div');panel.className='info-modal open';panel.innerHTML=`<div class="info-card"><button class="secondary" style="margin:0 0 15px" id="closeInfo">إغلاق</button><h2>${title}</h2>${content}</div>`;document.body.appendChild(panel);panel.querySelector('#closeInfo').onclick=()=>panel.remove()}async function openCustomerHistory(){const r=await fetch('/api/rides/history',{headers:auth()});const rides=r.ok?await r.json():[];openSidebarPanel('رحلاتي السابقة',rides.length?rides.map(x=>`<div class="info-row"><b>${x.tripNumber}</b><span>${x.from||'—'} ← ${x.to||'—'}<br>${x.status} · ${Number(x.price||0).toFixed(2)} د.أ</span></div>`).join(''):'<p>لا توجد رحلات سابقة محفوظة.</p>')}function openCustomerWallet(){fetch('/api/wallets/me',{headers:auth()}).then(r=>r.json()).then(d=>openSidebarPanel('محفظتي',`<div class="info-row"><b>الرصيد الحالي</b><strong>${Number(d.balance||0).toFixed(2)} د.أ</strong></div><p>إضافة رصيد عبر البطاقة البنكية</p><input id="cardAmount" type="number" min="1" placeholder="المبلغ بالدينار"><input id="cardNumber" inputmode="numeric" placeholder="رقم البطاقة"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="cardExpiry" placeholder="MM/YY"><input id="cardCvc" inputmode="numeric" placeholder="CVC"></div><button class="primary" id="payCard">متابعة الدفع الآمن</button><p id="cardMsg" class="msg">لن يتم حفظ رقم البطاقة.</p>`).then(()=>{$('payCard').onclick=()=>{$('cardMsg').textContent='سيتم تحويلك لمزود الدفع عند ربط بوابة الدفع.'}}))}function openCustomerSettings(){const muted=localStorage.getItem('nashmi_mute_sound')==='true';openSidebarPanel('الإعدادات',`<label style="display:flex;align-items:center;gap:10px;margin:18px 0"><input id="muteSound" type="checkbox" ${muted?'checked':''}> كتم صوت التطبيق</label><button class="primary" id="saveSettings">حفظ الإعدادات</button><hr style="border-color:#ffffff18;margin:22px 0"><p style="color:#fca5a5">طلب حذف الحساب يعطّل تسجيل الدخول ويحذف الجلسات، مع إبقاء سجل الرحلات محفوظًا.</p><button class="secondary" id="requestDelete" style="color:#fca5a5">طلب حذف الحساب</button><p id="settingsMsg" class="msg"></p>`);$('saveSettings').onclick=()=>{localStorage.setItem('nashmi_mute_sound',$('muteSound').checked?'true':'false');$('settingsMsg').textContent='تم حفظ الإعدادات'};$('requestDelete').onclick=async()=>{if(!confirm('هل أنت متأكد من طلب حذف الحساب؟'))return;const r=await fetch('/api/auth/account',{method:'DELETE',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({confirmation:'DELETE'})});const d=await r.json();if(!r.ok){$('settingsMsg').textContent=d.error||'تعذر حذف الحساب';return}localStorage.removeItem('nashmi_customer_token');alert(d.message);location.reload()}}
async function openPromo(){openSidebarPanel('العروض والخصومات',`<p>أدخل كوبون الخصم الصادر من الإدارة.</p><input id="promoCode" placeholder="مثال: NASHMI10"><button class="primary" id="redeemPromo">تطبيق الكوبون</button><p id="promoMsg" class="msg"></p>`);$('redeemPromo').onclick=async()=>{const r=await fetch('/api/promos/redeem',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({code:$('promoCode').value})});const d=await r.json();$('promoMsg').textContent=r.ok?`تمت إضافة ${Number(d.amount||0).toFixed(2)} د.أ إلى المحفظة`:(d.error||'الكوبون غير صالح')}}$('customerMenu').onclick=()=>$('customerDrawer').classList.add('open');$('closeCustomerMenu').onclick=()=>$('customerDrawer').classList.remove('open');$('drawerLogout').onclick=()=>{localStorage.removeItem('nashmi_customer_token');location.reload()};$('drawerHistory').onclick=()=>{$('customerDrawer').classList.remove('open');openCustomerHistory()};$('drawerWallet').onclick=()=>{$('customerDrawer').classList.remove('open');openCustomerWallet()};document.querySelectorAll('.drawer-item').forEach(b=>{if(b.textContent.includes('العروض'))b.onclick=()=>{$('customerDrawer').classList.remove('open');openPromo()}});$('customerProfile').onclick=()=>{$('customerDrawer').classList.remove('open');openSidebarPanel('الملف الشخصي',`<div class="info-row"><span>الاسم</span><b>${s.user?.name||'—'}</b></div><div class="info-row"><span>الهاتف</span><b>${s.user?.phone||'—'}</b></div><div class="info-row"><span>نوع الحساب</span><b>عميل</b></div><div class="info-row"><span>الحالة</span><b>حساب مفعّل</b></div>`)};
$('customerSettings').onclick=()=>{$('customerDrawer').classList.remove('open');openCustomerSettings()};$('becomeCaptain').onclick=()=>{window.location.href='/captain'};async function loadWallet(){const r=await fetch('/api/wallets/me',{headers:auth()});if(r.ok){const d=await r.json();$('wallet').textContent=`محفظتك: ${Number(d.balance||0).toFixed(2)} د.أ`;$('drawerBalance').textContent=`${Number(d.balance||0).toFixed(2)} JOD`}}async function loadCustomerProfile(){const r=await fetch('/api/auth/me',{headers:auth()});if(r.ok){const d=await r.json();s.user=d.user;$('customerName').textContent=d.user.name||'العميل';$('customerSummary').textContent=`${d.user.phone||'—'} · عميل مفعّل`}}async function refreshCustomerSession(){if(!s.token)return false;const r=await fetch('/api/auth/me',{headers:auth()});if(r.status===401){invalidateCustomerSession();return false}if(!r.ok)return false;const d=await r.json();s.user=d.user;$('customerName').textContent=d.user.name||'العميل';$('customerSummary').textContent=`${d.user.phone||'—'} · عميل مفعّل`;return true}if(s.token){refreshCustomerSession().then(valid=>{if(valid){$('rideScreen').classList.add('active');loadMine();loadWallet()}})}setInterval(()=>{if(s.token)refreshCustomerSession().then(valid=>{if(valid)loadMine()})},8000);
</script>
</body></html>
