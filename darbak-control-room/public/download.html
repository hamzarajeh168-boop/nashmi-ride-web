<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ناشمي رايد | تحميل</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(150deg, #07141d, #0d1d2d 50%, #081920);
        color: white;
        font-family: Arial, Tahoma, sans-serif;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 16px;
      }
      .box {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 22px;
        padding: 28px;
      }
      h1 { margin-top: 0; }
      a {
        display: inline-block;
        margin: 8px 0;
        padding: 12px 16px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        background: linear-gradient(135deg, #f8d76e, #f0b940);
        color: #09151d;
      }
      a.secondary { background: rgba(99,185,255,0.12); color: white; border: 1px solid rgba(99,185,255,0.25); }
      a.green { background: rgba(69,214,136,0.12); color: white; border: 1px solid rgba(69,214,136,0.28); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="box">
        <h1>منصة ناشمي رايد</h1>
        <p>اختر الصفحة المناسبة لك:</p>
        <p><a href="/passenger">صفحة الراكب</a></p>
        <p><a href="/captain" class="secondary">صفحة الكابتن</a></p>
        <p><a href="/control-room" class="green">غرفة التحكم</a></p>
      </div>
    </div>
  </body>
</html>
